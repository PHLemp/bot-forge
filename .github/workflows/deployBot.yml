name: Deploy the bot

on:
  workflow_dispatch:  # Permet aussi le déclenchement manuel
    inputs:
      restart_bot:
        description: 'Restart the bot after deployment'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Display deployment info
        run: |
          echo "🚀 Deploying branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy to Linux Server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -eu

            cd ~/bot-forge
            echo "📥 Pulling latest code from GitHub..."
            git pull origin main
            
            echo "📦 Installing dependencies..."
            npm ci
            
            echo "🔨 Building TypeScript..."
            npx tsc
            
            if [ "${{ inputs.restart_bot }}" = "true" ]; then
              echo "🔄 Restarting bot with PM2..."
              pm2 restart discord-bot || pm2 start dist/bot.js --name discord-bot
              pm2 status
            else
              echo "⏸️ Skipping bot restart"
            fi
            
            echo "✅ Deployment complete!"
            pm2 status

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi
