name: Start or stop the bot

on:
  workflow_dispatch:  # Permet aussi le déclenchement manuel
    inputs:
      start_stop:
        description: 'Y == start, N == stop'
        required: true
        default: true
        type: boolean

jobs:
  start_stop:
    name: Connect and start or stop the bot
    runs-on: ubuntu-latest

    steps:
      - name: Start or stop the bot
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/bot-forge
            
            if [ "${{ inputs.start_stop }}" = "false" ]; then
              echo "Stopping bot..."
              pm2 stop discord-bot
              echo "Bot stopped!"
            else
              echo "Starting bot..."
              pm2 start dist/bot.js --name discord-bot
              echo "Bot started!"
            fi
            pm2 status

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Bot start/stop successful!"
          else
            echo "❌ Ohoh, can't start/stop the bot!"
          fi
